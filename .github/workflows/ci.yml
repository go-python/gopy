name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ '**' ]

env:
  TAGS: "-tags=ci"
  # Init() in main_test will make sure all backends are available if
  # GOPY_TRAVIS_CI is set
  GOPY_TRAVIS_CI: 1
  GOTRACEBACK: crash
  GO111MODULE: auto

jobs:

  build:
    name: Build (${{ matrix.platform }}, Go ${{ matrix.go-version }}, Python ${{ matrix.python-version }})
    strategy:
      fail-fast: false
      matrix:
        # TODO: Consider official support matrix (OS and Go versions) and adjust this matrix accordingly
        go-version: [1.25.x, 1.24.x, 1.23.x, 1.22.x]
        platform: [ubuntu-latest, windows-latest, macos-15]
        python-version: ['3.11', '3.12']
    runs-on: ${{ matrix.platform }}
    env:
      # Coverage is measured on exactly one matrix leg, so the numbers stay
      # comparable from commit to commit.
      COVERAGE_LEG: ${{ matrix.platform == 'ubuntu-latest' && matrix.go-version == '1.25.x' && matrix.python-version == '3.12' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ matrix.go-version }}
        cache: true

    - name: Install Linux packages
      if: matrix.platform == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install curl libffi-dev python3-cffi python3-pip
        # install pybindgen
        python3 -m pip install --user -U pybindgen
        # install goimports
        go install golang.org/x/tools/cmd/goimports@latest

    - name: Install macOS packages
      if: startsWith(matrix.platform, 'macos-')
      run: |
        python3 -m pip install -U pybindgen
        go install golang.org/x/tools/cmd/goimports@latest

    - name: Install Windows packages
      if: matrix.platform == 'windows-latest'
      run: |
        # install pybindgen and psutil (for memory tracking in tests)
        python -m pip install -U pybindgen psutil
        # install goimports
        go install golang.org/x/tools/cmd/goimports@latest


    - name: Build-Linux
      if: matrix.platform == 'ubuntu-latest'
      run: |
        make
    - name: Test Linux
      if: matrix.platform == 'ubuntu-latest' && env.COVERAGE_LEG != 'true'
      run: |
        make test
    - name: Test Linux (with coverage)
      if: env.COVERAGE_LEG == 'true'
      run: |
        make cover
    - name: Coverage summary
      if: env.COVERAGE_LEG == 'true'
      run: |
        {
          echo "## Test coverage"
          echo
          echo "Commit \`${GITHUB_SHA}\`: **$(go tool cover -func=coverage.out | tail -n 1 | awk '{print $NF}')** of statements"
          echo
          echo "<details><summary>Per-function coverage</summary>"
          echo
          echo '```'
          go tool cover -func=coverage.out
          echo '```'
          echo "</details>"
        } >> "$GITHUB_STEP_SUMMARY"
    - name: Upload coverage profile
      if: env.COVERAGE_LEG == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage.out

    - name: Build-macOS
      if: startsWith(matrix.platform, 'macos-')
      run: |
        make
    - name: Test macOS
      if: startsWith(matrix.platform, 'macos-')
      run: |
        make test

    - name: Build-Windows
      if: matrix.platform == 'windows-latest'
      run: |
        go build -v ./...
    - name: Test Windows
      if: matrix.platform == 'windows-latest'
      run: |
        go test -v ./...
    # Long-term history/trends. Needs a CODECOV_TOKEN repo secret (or
    # tokenless uploads enabled for the org on codecov.io); without one this
    # step only warns, and the step summary + artifact above still work.
    - name: Upload-Coverage
      if: env.COVERAGE_LEG == 'true'
      uses: codecov/codecov-action@v5
      with:
        files: coverage.out
        disable_search: true
        token: ${{ secrets.CODECOV_TOKEN }}
        fail_ci_if_error: false
